<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Sruthi Arts</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding-inline: 16px; background: #0e0c16; color: #ece8f4; font: 1rem/1.6 Georgia, serif; text-align: center; }
  h1 { font-weight: 400; font-size: 2.4rem; margin: 0 0 8px; }
  p { color: #a8a1bd; margin: 0 0 24px; }
  a { color: #0e0c16; background: #e3c78f; padding: 10px 20px; border-radius: 999px; text-decoration: none; font-family: system-ui, sans-serif; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>This page wandered off</h1>
  <p>The painting or page you’re looking for isn’t here.</p>
  <a id="home" href="/">Back to the gallery</a>
</main>
<script>
  // GitHub Pages project sites live under /<repo>/, so send visitors to that root.
  var seg = location.pathname.split("/")[1];
  if (location.hostname.endsWith("github.io") && seg) document.getElementById("home").href = "/" + seg + "/";
</script>
</body>
</html>
