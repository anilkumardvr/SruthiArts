# Classic admin editor for Sruthi Arts — backup for /admin (Sveltia CMS, https://github.com/sveltia/sveltia-cms)
# Every "Save" commits to main, and GitHub Actions rebuilds and redeploys the site in about a minute.
#
#   Shop items          one post per item   -> content/items/<link-name>.json
#   Website > Page text  every heading and paragraph on the page -> content/pages.json
#   Website > Contact & payment                                   -> content/settings.json

backend:
  name: github
  repo: anilkumardvr/SruthiArts
  branch: main
  commit_messages:
    create: "Admin: add {{slug}}"
    update: "Admin: update {{slug}}"
    delete: "Admin: remove {{slug}}"
    uploadMedia: "Admin: upload {{path}}"
    deleteMedia: "Admin: delete {{path}}"

site_url: https://www.sruthiarts.com/
display_url: https://www.sruthiarts.com/

# Uploaded photos go into site/images/paintings and are referenced from the page as images/paintings/<file>
media_folder: site/images/paintings
public_folder: images/paintings

# Phone photos are resized and converted to WebP on upload so the site stays fast.
media_libraries:
  default:
    config:
      max_file_size: 15000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 2000

collections:
  - name: items
    label: Shop items
    label_singular: item
    description: "Each item is one post on the shop wall. Newest first."
    icon: storefront
    folder: content/items
    format: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} · {{category}} · {{status}}"
    thumbnail: image
    sortable_fields:
      fields: [date, title, price]
      default: { field: date, direction: descending }
    view_filters:
      - { label: Ludo boards, field: category, pattern: ludo-boards }
      - { label: Clocks, field: category, pattern: clocks }
      - { label: Originals, field: category, pattern: originals }
      - { label: Prints, field: category, pattern: prints }
      - { label: Sold, field: status, pattern: sold }
    fields:
      - name: image
        label: Cover photo
        widget: image
        hint: "A straight-on photo in good daylight. Portrait (taller than wide) looks best."
      - name: images
        label: All photos
        label_singular: photo
        widget: list
        required: false
        hint: "Every photo of this piece, in order (up to 10). Buyers swipe through them. The cover photo is always shown first."
        field: { name: photo, label: Photo, widget: image }
      - { name: title, label: Title, widget: string }
      - name: category
        label: Category
        widget: select
        default: originals
        options:
          - { label: Ludo boards, value: ludo-boards }
          - { label: Clocks, value: clocks }
          - { label: Originals, value: originals }
          - { label: Prints, value: prints }
      - { name: description, label: Description, widget: text, hint: "A sentence or two, like an Instagram caption." }
      - name: price
        label: Price
        widget: number
        value_type: int
        min: 0
        hint: "Whole number in the shop currency, e.g. 249"
      - name: quantity
        label: Quantity available
        widget: number
        value_type: int
        min: 0
        default: 1
        hint: "How many are left. Goes down by itself after each PayPal sale; at 0 the item shows as Sold."
      - name: status
        label: Status
        widget: select
        default: available
        options:
          - { label: Available, value: available }
          - { label: Sold, value: sold }
      - name: medium
        label: Medium
        widget: select
        options: ["Acrylic on canvas", "Oil on canvas", "Watercolor", "Gouache", "Mixed media", "Ink on paper", "Pencil on paper", "Acrylic on wood", "Art print"]
      - { name: width, label: Width (cm), widget: number, value_type: int, min: 1 }
      - { name: height, label: Height (cm), widget: number, value_type: int, min: 1 }
      - name: alt
        label: Photo description
        widget: string
        hint: "One sentence describing what the photo shows, read aloud to visitors who can't see it."
      - name: date
        label: Listed on
        widget: datetime
        default: "{{now}}"
        hint: "Newest items appear first on the site."
      - name: paypalLink
        label: Custom PayPal link (optional)
        widget: string
        required: false
        hint: "Leave empty to use the shop's PayPal.me link with this item's price."

  - name: website
    label: Website
    icon: web
    files:
      - name: pages
        label: Page text
        file: content/pages.json
        format: json
        fields:
          - name: hero
            label: Top of the page
            widget: object
            fields:
              - { name: eyebrow, label: Small line above the headline, widget: string, required: false }
              - { name: title, label: Headline, widget: string }
              - { name: titleAccent, label: Headline (pink italic part), widget: string, required: false }
              - { name: intro, label: Intro paragraph, widget: text }
          - name: about
            label: About the artist
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text, hint: "Leave an empty line between paragraphs." }
              - { name: photo, label: Photo of the artist (optional), widget: image, required: false }
              - { name: photoAlt, label: Photo description, widget: string, required: false }
          - name: buy
            label: How to buy
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - name: steps
                label: Steps
                label_singular: step
                widget: list
                summary: "{{title}}"
                fields:
                  - { name: title, label: Step title, widget: string }
                  - { name: text, label: Step text, widget: text }
          - name: contact
            label: Contact section
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
          - name: footer
            label: Footer
            widget: object
            fields:
              - { name: text, label: Footer text, widget: string }

      - name: settings
        label: Contact & payment
        file: content/settings.json
        format: json
        fields:
          - { name: name, label: Artist name, widget: string }
          - { name: instagram, label: Instagram username, widget: string, required: false, hint: "Without the @, e.g. sruthi_artss" }
          - { name: email, label: Email, widget: string, required: false, hint: "Optional. Shown in the contact section with a copy button." }
          - { name: paypal, label: PayPal.me username, widget: string, required: false, hint: "The part after paypal.me/ — turns on the Buy with PayPal button on every available item" }
          - { name: currency, label: Currency, widget: select, default: CAD, options: ["CAD", "USD", "INR", "GBP", "EUR"] }
          - { name: checkoutApi, label: Checkout server URL, widget: string, required: false, hint: "Your Cloudflare Worker address, e.g. https://sruthiarts-checkout.<you>.workers.dev" }
          - { name: paypalClientId, label: PayPal client ID, widget: string, required: false, hint: "Public client ID from developer.paypal.com. With the server URL, this turns on checkout." }
