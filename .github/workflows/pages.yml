name: Validate and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - name: Build shop data from content/
        run: node scripts/build-data.mjs
      - name: Check shop data and file references
        run: node scripts/validate.mjs
      - name: Install storefront dependencies
        run: npm ci
        working-directory: storefront
      - name: Build storefront (type-check + Vite)
        run: npm run build
        working-directory: storefront

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - name: Build shop data from content/
        run: node scripts/build-data.mjs
      - name: Install storefront dependencies
        run: npm ci
        working-directory: storefront
      # Vite copies site/ (admin/, images/, data/shop.json, favicon.svg, 404.html) into storefront/dist as-is.
      - name: Build storefront
        run: npm run build
        working-directory: storefront
      - name: Check the site bundle has the admin, images and shop data
        run: |
          for f in index.html admin/index.html admin/admin.js data/shop.json favicon.svg 404.html; do
            test -f "storefront/dist/$f" || { echo "::error::storefront/dist/$f is missing"; exit 1; }
          done
          test -d storefront/dist/images/paintings || { echo "::error::storefront/dist/images/paintings is missing"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: storefront/dist
      - id: deployment
        uses: actions/deploy-pages@v4
